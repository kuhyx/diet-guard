# Pre-commit Configuration for diet-guard
# Run `pre-commit install` after cloning: pre-commit hooks are not automatic.
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Run:      pre-commit run --all-files
# Update:   pre-commit autoupdate

default_language_version:
  python: python3
default_stages: [pre-commit]
fail_fast: false

default_install_hook_types: [pre-commit, pre-push, post-commit, post-merge, post-rewrite]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: requirements-txt-fixer

  - repo: local
    hooks:
      - id: no-noqa
        name: Block noqa comments
        entry: '(?i)#\s*(noqa|type:\s*ignore)'
        language: pygrep
        types: [python]
      - id: no-ruff-noqa
        name: Block ruff noqa file-level comments
        entry: '(?i)#\s*ruff:\s*noqa'
        language: pygrep
        types: [python]
      - id: requirements-sync
        name: requirements.txt covers all package imports
        entry: python3 scripts/check_requirements_sync.py
        language: system
        pass_filenames: false
        files: ^(diet_guard/.*\.py|requirements\.txt)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      # Split into <60 s steps (run in this order); no-arg ci_mirror.sh is the CI form.
      - id: ci-mirror-venv
        name: CI mirror 1 (clean venv)
        entry: bash scripts/ci_mirror.sh venv
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-precommit
        name: CI mirror 2 (pre-commit --all-files)
        entry: bash scripts/ci_mirror.sh precommit
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-pytest
        name: CI mirror 3 (pytest, xvfb, 100% cov)
        entry: bash scripts/ci_mirror.sh pytest
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-1
        name: CI mirror 5 (flutter test 1/12)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 0/12
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-2
        name: CI mirror 6 (flutter test 2/12)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 1/12
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-3
        name: CI mirror 7 (flutter test 3/12)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 2/12
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-4
        name: CI mirror 8 (flutter test 4/12)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 3/12
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-5
        name: CI mirror 9 (flutter test 5/12)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 4/12
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-6
        name: CI mirror 10 (flutter test 6/12)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 5/12
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-7
        name: CI mirror 11 (flutter test 7/12)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 6/12
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-8
        name: CI mirror 12 (flutter test 8/12)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 7/12
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-9
        name: CI mirror 13 (flutter test 9/12)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 8/12
        language: system
        pass_filenames: false
