# Dependencies held below latest stable in this repo, and why. `transitive:`
# entries are predicates: they clear themselves when the blocker moves, so
# they carry no `expires`; everything else is discretionary and expires.

exceptions:
  - ecosystem: gittag
    package: kuhy-credit
    pinned: 0.3.1
    reason: >-
      sickdays 0.5.8 (its newest release) pins kuhy-credit 0.3.1 exactly, so
      pip refuses 0.3.2 next to it. Taking 0.3.2 means holding sickdays back
      instead; sickdays is the dependency the gate actually runs.
    blocked_by: transitive:sickdays@0.5.8
